# StyleX development stack: MongoDB + FastAPI (hot reload) + Vite (hot reload)
#
#   cp backend/.env.example backend/.env   # then add your API keys (optional)
#   docker compose up --build
#
# Frontend: http://localhost:5173   API: http://localhost:8000/docs
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Overrides .env so the container talks to the compose MongoDB service
      DATABASE_URL: mongodb://mongo:27017
      DATABASE_NAME: stylex
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      USE_GPU: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      # Browser-side URL: the browser reaches the backend through the host port
      VITE_API_URL: http://localhost:8000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
  frontend_node_modules:
